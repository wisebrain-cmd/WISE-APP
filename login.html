<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in or create your Wse Adventures account.">
  <title>Welcome | Wse Adventures</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <header class="site-header">
    <nav class="site-nav" aria-label="Main navigation">
      <a class="nav-title" href="/">Wse Adventures</a>
      <a class="nav-link" href="/">Explore adventures</a>
    </nav>
  </header>
  <main class="auth-layout">
    <section class="auth-card" aria-labelledby="auth-title">
      <p class="hero-kicker">Your next adventure starts here</p>
      <h1 id="auth-title">Welcome back.</h1>
      <p class="auth-description" id="auth-description">Sign in and find your next little escape.</p>
      <div class="auth-tabs" role="group" aria-label="Account action">
        <button type="button" class="auth-tab active" id="login-tab">Sign in</button>
        <button type="button" class="auth-tab" id="register-tab">Create account</button>
      </div>
      <form id="auth-form">
        <div id="name-field" hidden>
          <label for="name">Your name</label>
          <input id="name" name="name" autocomplete="name" minlength="2" maxlength="80">
        </div>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required>
        <p class="password-note">Use at least 12 characters.</p>
        <p id="auth-message" role="status" aria-live="polite"></p>
        <button class="hero-button" id="submit-button" type="submit">Sign in</button>
      </form>
      <p class="auth-footer">Small moments. New places. Your own pace.</p>
      <a class="back-link" href="/">Explore adventures</a>
    </section>
  </main>
  <script src="auth.js"></script>
</body>
</html>
