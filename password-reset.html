<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Recover access to your WSE Adventures account.">
  <title>Password recovery | WSE Adventures</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <header class="site-header">
    <nav class="site-nav" aria-label="Main navigation">
      <a class="nav-title" href="/">WSE Adventures</a>
      <a class="nav-link" href="/login.html">Sign in</a>
    </nav>
  </header>
  <main class="auth-layout">
    <section class="auth-card" aria-labelledby="auth-title">
      <p class="hero-kicker">ACCOUNT RECOVERY</p>
      <h1 id="auth-title">Reset your password.</h1>
      <p class="auth-description" id="auth-description">Enter your email and we’ll send a secure reset link if an account matches.</p>
      <form class="account-form" id="request-form" hidden>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        <button class="hero-button" type="submit">Send reset link</button>
      </form>
      <form class="account-form" id="reset-form" hidden>
        <label for="new-password">New password</label>
        <input id="new-password" name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
        <p class="password-note">Use at least 12 characters.</p>
        <button class="hero-button" type="submit">Save new password</button>
      </form>
      <p class="auth-status" id="auth-message" role="status" aria-live="polite"></p>
      <a class="back-link" href="/login.html">Return to sign in</a>
    </section>
  </main>
  <script src="/password-recovery.js"></script>
</body>
</html>
