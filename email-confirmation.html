<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Confirm the email address for your WSE Adventures account.">
  <title>Verify your email | WSE Adventures</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <header class="site-header">
    <nav class="site-nav" aria-label="Main navigation">
      <a class="nav-title" href="/">WSE Adventures</a>
      <a class="nav-link" href="/login.html">Sign in</a>
    </nav>
  </header>
  <main class="auth-layout">
    <section class="auth-card" aria-labelledby="auth-title">
      <p class="hero-kicker">ACCOUNT SECURITY</p>
      <h1 id="auth-title">Verify your email.</h1>
      <p class="auth-description" id="auth-description">Confirm your email address to finish signing in.</p>
      <form class="account-form" id="verify-form" hidden>
        <button class="hero-button" type="submit">Verify email and continue</button>
      </form>
      <form class="account-form" id="resend-form" hidden>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        <button class="hero-button" type="submit">Send a verification link</button>
      </form>
      <p class="auth-status" id="auth-message" role="status" aria-live="polite"></p>
      <a class="back-link" href="/login.html">Return to sign in</a>
    </section>
  </main>
  <script src="/email-confirmation.js"></script>
</body>
</html>
