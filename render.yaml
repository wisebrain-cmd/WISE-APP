services:
  - type: web
    name: wise-app
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: wise-app-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
